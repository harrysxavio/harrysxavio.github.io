<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de conciliación de inventario</title>
  <desc id="desc">Existencias de operación y registros de sistemas llegan a una conciliación. Las diferencias pasan a revisión de excepciones y seguimiento de control.</desc>
  <style>
    .line{fill:none;stroke:#8396a1;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.node{fill:#f4f0e7;stroke:#172d45;stroke-width:2}.focus{fill:#ab3d32;stroke:#ab3d32}.label{fill:#172d45;font:700 18px system-ui,sans-serif}.note{fill:#536777;font:500 15px system-ui,sans-serif}.inverse{fill:#fff}
  </style>
  <path class="line" d="M180 82h56q28 0 28 28v20q0 24 28 24h44q28 0 28-24v-20q0-28 28-28h44m-100 72h56q28 0 28 28v8q0 22 26 22h42"/>
  <rect class="node" x="18" y="50" width="162" height="64" rx="3"/><rect class="node" x="18" y="150" width="162" height="64" rx="3"/>
  <rect class="focus" x="264" y="98" width="100" height="64" rx="3"/><rect class="node" x="464" y="50" width="194" height="64" rx="3"/><rect class="node" x="464" y="166" width="194" height="64" rx="3"/>
  <text class="label" x="99" y="77" text-anchor="middle">Operación</text><text class="note" x="99" y="98" text-anchor="middle">existencias</text>
  <text class="label" x="99" y="177" text-anchor="middle">Sistemas</text><text class="note" x="99" y="198" text-anchor="middle">registros</text>
  <text class="label inverse" x="314" y="126" text-anchor="middle">Conciliar</text><text class="note inverse" x="314" y="147" text-anchor="middle">validar</text>
  <text class="label" x="561" y="77" text-anchor="middle">Excepciones</text><text class="note" x="561" y="98" text-anchor="middle">revisión</text>
  <text class="label" x="561" y="193" text-anchor="middle">Control</text><text class="note" x="561" y="214" text-anchor="middle">seguimiento</text>
</svg>
