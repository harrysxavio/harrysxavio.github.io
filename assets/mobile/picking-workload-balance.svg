<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" role="img" aria-labelledby="title desc">
  <title id="title">Balanceo de carga de picking</title><desc id="desc">Los pedidos se agrupan por zona y se balancea la carga de trabajo entre equipos de picking en el centro de distribución.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#182b43;font-size:16px;font-weight:600}.muted{fill:#526173;font-size:14px;font-weight:400}.node{fill:#fbf8f1;stroke:#9ca9b5;stroke-width:1.5}.accent{fill:#e8edf2;stroke:#526173}</style>
  <rect width="360" height="340" rx="12" fill="#f4f0e7"/>
  <rect class="node" x="54" y="20" width="252" height="58" rx="8"/><text x="180" y="45" text-anchor="middle">Pedidos</text><text class="muted" x="180" y="66" text-anchor="middle">ordenes por preparar</text>
  <path d="M180 78v25" fill="none" stroke="#a8463b" stroke-width="2"/><path d="m173 97 7 7 7-7" fill="none" stroke="#a8463b" stroke-width="2"/>
  <rect class="node" x="54" y="108" width="252" height="58" rx="8"/><text x="180" y="133" text-anchor="middle">Balanceo de carga</text><text class="muted" x="180" y="154" text-anchor="middle">distribuir trabajo de picking</text>
  <path d="M180 166v20M180 186H98v15M180 186h82v15" fill="none" stroke="#a8463b" stroke-width="2"/><path d="m91 194 7 7 7-7M255 194l7 7 7-7" fill="none" stroke="#a8463b" stroke-width="2"/>
  <rect class="accent" x="28" y="210" width="140" height="66" rx="8"/><text x="98" y="239" text-anchor="middle">Zona A</text><text class="muted" x="98" y="261" text-anchor="middle">picking</text>
  <rect class="accent" x="192" y="210" width="140" height="66" rx="8"/><text x="262" y="239" text-anchor="middle">Zona B</text><text class="muted" x="262" y="261" text-anchor="middle">picking</text>
  <text class="muted" x="180" y="309" text-anchor="middle">centro de distribución</text>
</svg>
