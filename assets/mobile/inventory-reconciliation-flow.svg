  <rect width="360" height="340" rx="12" fill="#f4f0e7"/>
  <rect class="node" x="18" y="24" width="150" height="72" rx="8"/><text x="32" y="53">Existencias</text><text class="muted" x="32" y="77">de operación</text>
  <rect class="node" x="192" y="24" width="150" height="72" rx="8"/><text x="206" y="53">Registros</text><text class="muted" x="206" y="77">de sistemas</text>
