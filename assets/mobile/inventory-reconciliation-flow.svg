  <path d="M180 217v28" fill="none" stroke="#a8463b" stroke-width="2"/><path d="m173 239 7 7 7-7" fill="none" stroke="#a8463b" stroke-width="2"/>
  <rect class="accent" x="54" y="253" width="252" height="65" rx="8"/><text x="180" y="280" text-anchor="middle">Excepciones y control</text><text class="muted" x="180" y="302" text-anchor="middle">revisión y seguimiento</text>
